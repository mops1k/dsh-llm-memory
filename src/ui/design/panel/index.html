<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>LLM Memory — панель управления</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cg fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 6 6 11l10 5 10-5-10-5Z'/%3E%3Cpath d='m6 21 10 5 10-5'/%3E%3Cpath d='m6 16 10 5 10-5'/%3E%3C/g%3E%3C/svg%3E" />
  <script>
    // Resolve the theme before the first paint: no light flash in dark mode.
    (function () {
      try {
        var pref = localStorage.getItem('lm-proto:theme') || 'system';
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = pref === 'system' ? (dark ? 'dark' : 'light') : pref;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePref = pref;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <!--LM_PROTOTYPE_CONFIG-->
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>

      <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/><circle cx="4" cy="12" r="2"/><circle cx="12" cy="10" r="2"/><circle cx="20" cy="14" r="2"/></symbol>

      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>

      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>

    </defs>
  </svg>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Навигация">
      <div class="brand">
        <span class="brand-mark"><svg class="ic" aria-hidden="true"><use href="#i-layers"/></svg></span>
        <span class="brand-text">
          <span class="brand-name">LLM Memory</span>
          <span class="brand-sub">панель управления</span>
        </span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <span class="mode-chip" id="mode-chip"><span class="dot"></span><span id="mode-label">Демо</span></span>
        <button class="store-path" id="store-path" type="button" title="Скопировать путь хранилища">
          <svg class="ic" aria-hidden="true" style="width:12px;height:12px"><use href="#i-database"/></svg>
          <span id="store-path-text">—</span>
        </button>
        <span class="sdk-version" id="sdk-version"></span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menu-btn" type="button" aria-label="Меню">
          <svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg>
        </button>
        <label class="project-pick">
          <span id="project-label">Проект</span>
          <select id="project-select" aria-label="Проект"></select>
        </label>
        <button class="topbar-search" id="palette-btn" type="button" aria-label="Открыть поиск и команды">
          <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
          <span id="palette-hint">Поиск записей, экранов и действий…</span>
          <kbd class="kbd">Ctrl K</kbd>
        </button>
        <div class="topbar-actions">
          <button class="icon-btn" id="theme-btn" type="button" aria-label="Тема" title="Тема">
            <svg class="ic" aria-hidden="true"><use href="#i-monitor"/></svg>
          </button>
          <button class="icon-btn lang-btn" id="lang-btn" type="button" title="Язык / Language">RU</button>
          <button class="icon-btn" id="help-btn" type="button" aria-label="Горячие клавиши" title="Горячие клавиши (?)">
            <svg class="ic" aria-hidden="true"><use href="#i-help"/></svg>
          </button>
        </div>
      </header>
      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="backdrop" id="backdrop" hidden></div>
  <div id="overlays"></div>
  <div class="toast-stack" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
