.layer {

.palette { width: min(640px, 100%); max-height: 68vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-3); overflow: hidden; }

.toast {

okShelf","dsh-agent-score","Zapret-DPI-Manager","dsh-plan-store","dsh-jetbrains"],pa=[{p:"dsh-llm-memory",k:"rules",t:"immutable",i:5,title:"Настройки и действия — часть ядра, панели только рендерят",text:"Схема настроек и реестр действий живут в core/domain. Панель не добавляет свои поля, экраны и колонки: расхождение — дефект паритета, его ловят тесты.",tags:["settings","core","parity"],kw:"settings actions core parity",days:5},{p:"dsh-llm-memory",k:"architecture",t:"important",i:5,title:"UI SDK: ядро отдаёт API, UI отрисовывает, харнесс только монтирует",text:"Экраны, виджеты, операции и снимки описаны в ui-schema.ts и ui-contract.ts. DSH, Kilo, OpenCode и MCP рендерят один контракт в своём дизайне.",tags:["ui-sdk","architecture","contract"],kw:"ui sdk snapshot contract widgets",days:6},{p:"dsh-llm-memory",k:"decisions",t:"important",i:5,title:"Векторный recall: эмбеддинг в worker-потоке, три ноги RRF",text:"BM25, вектор и метаданные объединяются reciprocal rank fusion. Эмбеддинг считается в worker_threads, поэтому recall остаётся асинхронным.",tags:["rag","vectors","rrf"],kw:"vector recall embeddings rrf bm25",days:9},{p:"dsh-llm-memory",k:"facts",t:"normal",i:4,title:"Хранилище памяти: ~/.dsh/llm-memory, страницы по проектам и слой _user",text:"БД в _db/memory.db, страницы проектов в отдельных каталогах, общесистемные факты — в слое _user.",tags:["storage","layout"],kw:"storage pages projects user layer",days:12},{p:"dsh-llm-memory",k:"architecture",t:"important",i:4,title:"Слоистая структура памяти: проект + _user, реестр projects.json",text:"Поиск по умолчанию идёт по текущему проекту и слою _user; scope=all расширяет его на все проекты.",tags:["storage","scope","recall"],kw:"scope project user projects.json",days:13},{p:"dsh-llm-memory",k:"decisions",t:"important",i:4,title:"Импорт памяти удалён полностью",text:"Фича признана ненужной: удалены core-модуль, HTTP-API, UI, команда /memory import и настройки.",tags:["import","removed"],kw:"import removed cleanup",days:20},{p:"dsh-llm-memory",k:"facts",t:"normal",i:3,title:"ADR-009: одно дерево src/, без packages/*, сборка в lib/",text:"Плагин — один пакет: слои core/, ui/ и adapters/. Импорты относительные, сборка tsc в lib/.",tags:["adr","structure","build"],kw:"adr-009 src flat build lib",days:25},{p:"dsh-llm-memory",k:"facts",t:"normal",i:3,title:"Пагинация списков приходит из схемы: [12,24,48,96] и [10,20,50]",text:"Записи листаются по 12/24/48/96, поиск — по 10/20/50. Панель не хардкодит размеры страниц.",tags:["ui","pagination"],kw:"pagination page sizes ui",days:26},{p:"dsh-llm-memory",k:"rules",t:"important",i:4,title:"Карта RAG обязательна в обеих панелях",text:"Экран map ссылается на vectors.map и vectors.health, параметры minScore/topK приходят из схемы.",tags:["ui","rag","map"],kw:"rag map vector map pca",days:28},{p:"dsh-llm-memory",k:"facts",t:"normal",i:3,title:"Kilo production cutover выполнен: плагин установлен, recall на живом сторе",text:"Старый дашборд остался на /legacy, корень отдаёт schema-driven панель.",tags:["kilo","cutover"],kw:"kilo cutover production panel",days:30},{p:"dsh-llm-memory",k:"architecture",t:"important",i:3,title:"Формат бэкапа .llmmem: магия LLMMEM1, ZIP и manifest с sha256",text:"Опционально AES-256-GCM. Перед восстановлением создаётся pre-restore копия.",tags:["backup","format"],kw:"backup llmmem zip manifest",days:32},{p:"dsh-llm-memory",k:"concepts",t:"normal",i:3,title:"RRF объединяет BM25, вектор и метаданные без калибровки скоров",text:"Ранжирование по сумме 1/(k+rank): разные шкалы не нужно нормализовать вручную.",tags:["rag","rrf","recall"],kw:"rrf fusion ranking retrieval",days:33},{p:"dsh-llm-memory",k:"decisions",t:"normal",i:3,title:"Язык панели задаётся uiLocale, снимок можно запросить с ?locale=",text:"Русские подписи приходят из схемы: labelRu/titleRu и localizedActions.",tags:["ui","locale"],kw:"locale ui ru en",days:35},{p:"dsh-llm-memory",k:"facts",t:"normal",i:4,title:"Модель Xenova/multilingual-e5-small, dim 384, кэш в <store>/_models",text:"Готовность считается по целостности: веса .onnx, config.json и токенизатор. Неполный кэш отдаётся в missing.",tags:["embeddings","model"],kw:"model e5 dim cache onnx",days:36},{p:"dsh-llm-memory",k:"preferences",t:"normal",i:2,title:"Светлая тема удобнее для длинных таблиц и настроек",text:"Тёмная тема нужна для вечерней работы; переключатель должен помнить выбор.",tags:["ui","theme"],kw:"theme light dark ui",days:38},{p:"dsh-llm-memory",k:"architecture",t:"normal",i:4,title:"Транспорт панели: DSH — /api/*, Kilo/OpenCode/MCP — /api/legacy/*",text:"Семантика операций одна, отличаются базовые пути и форма ответа legacy-адаптера.",tags:["api","transport"],kw:"api transport legacy dsh",days:40},{p:"dsh-llm-memory",k:"facts",t:"normal",i:4,title:"UI-схема: 10 экранов, 4 группы настроек, 35 полей и 13 действий",text:"Версии контракта: UI_SCHEMA_VERSION=1, UI_CONTRACT_VERSION=1. При несовместимом изменении версия увеличивается.",tags:["ui-sdk","schema"],kw:"schema version fields actions",days:41},{p:"dsh-llm-memory",k:"decisions",t:"important",i:4,title:"Дизайн панели живёт отдельно от схемы: один panel.html на все HTTP-хосты",text:"Хост передаёт window.__LM_PANEL__ (apiBase, kind, locale), из схемы берутся вкладки, настройки и действия.",tags:["ui","design","panel"],kw:"panel design html host",days:44},{p:"VoiceTyper",k:"facts",t:"normal",i:4,title:"Windows: вставка через WM_CHAR проверяется чтением поля",text:"Подтверждённая доставка считается успешной, только если текст появился в поле; иначе он уходит в буфер обмена.",tags:["windows","insertion"],kw:"wm_char paste windows verification",days:3},{p:"VoiceTyper",k:"decisions",t:"normal",i:4,title:"Неподтверждённая доставка не теряется: уходит в буфер обмена",text:"Пользователь всегда может вставить текст вручную; лог содержит причину.",tags:["windows","clipboard"],kw:"clipboard fallback windows",days:7},{p:"VoiceTyper",k:"preferences",t:"normal",i:3,title:"Старт диктовки — Pause/Break, сто
